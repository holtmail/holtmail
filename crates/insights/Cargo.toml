[package]
name = "holtmail-insights"
description = "Runs insight extractors over a parsed message: input caps, auth facts, merge, validation and fingerprints"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
holtmail-auth-results.workspace = true
holtmail-core.workspace = true
holtmail-html-scan.workspace = true
holtmail-insight.workspace = true
holtmail-mime.workspace = true
holtmail-people.workspace = true
holtmail-store.workspace = true
blake3.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true

[dev-dependencies]
holtmail-insight = { workspace = true, features = ["testing"] }
holtmail-insight-code.workspace = true
holtmail-insight-unsubscribe.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# The workspace lints, except that `unsafe_code` is denied instead of forbidden: the test-only
# counting allocator in tests/bounds.rs needs `unsafe impl GlobalAlloc`. The library itself keeps
# `#![forbid(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
