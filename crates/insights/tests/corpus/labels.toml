# Labels for the corpus gate (docs/INSIGHTS.md §15). Every message here is invented.
#
# code: the one code the card must show (Likely or higher); absent means none.
# origin: the origin of a WICG origin-bound code.
# unsubscribe: the exact unsubscribe item; absent means none.
# negative: the hard-negative family a message belongs to when nothing of that kind is
#   expected (a code family, or a link_* or parcel_* family).
# links: the expected Likely actions, primary first; host is the destination host after
#   unwrapping, lowercase A-label. Absent means none.
# parcel: the expected Likely parcels, compact uppercase number. Absent means none.
# structured: the expected structured items as { type, ref }; see the section at the end.
# kind: the kind stage B gives with the signals categorizer and no trusted authserv-id
#   (docs/INSIGHTS.md §4.2: header rules, then the content gate). Required.
# topics: the topics it gives under the same trust (unknown), so never a sensitive one.
#   Required; [] means none.

