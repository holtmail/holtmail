[workspace]
resolver = "3"
members = ["apps/server", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/holtmail/holtmail"

[workspace.dependencies]
holtmail-api = { path = "crates/api" }
holtmail-auth = { path = "crates/auth" }
holtmail-blob = { path = "crates/blob" }
holtmail-blob-fs = { path = "crates/blob-fs" }
holtmail-blob-s3 = { path = "crates/blob-s3" }
holtmail-core = { path = "crates/core" }
holtmail-export = { path = "crates/export" }
holtmail-extract = { path = "crates/extract" }
holtmail-extract-basic = { path = "crates/extract-basic" }
holtmail-fetch = { path = "crates/fetch" }
holtmail-fetch-http = { path = "crates/fetch-http" }
holtmail-import = { path = "crates/import" }
holtmail-index = { path = "crates/index" }
holtmail-index-tantivy = { path = "crates/index-tantivy" }
holtmail-ingest = { path = "crates/ingest" }
holtmail-mime = { path = "crates/mime" }
holtmail-oauth = { path = "crates/oauth" }
holtmail-oauth-http = { path = "crates/oauth-http" }
holtmail-query = { path = "crates/query" }
holtmail-remote = { path = "crates/remote" }
holtmail-sanitize = { path = "crates/sanitize" }
holtmail-secret = { path = "crates/secret" }
holtmail-secret-local = { path = "crates/secret-local" }
holtmail-source = { path = "crates/source" }
holtmail-source-graph = { path = "crates/source-graph" }
holtmail-source-imap = { path = "crates/source-imap" }
holtmail-source-jmap = { path = "crates/source-jmap" }
holtmail-store = { path = "crates/store" }
holtmail-store-sqlite = { path = "crates/store-sqlite" }
holtmail-sync = { path = "crates/sync" }
holtmail-thumbnail = { path = "crates/thumbnail" }

ammonia = "4"
anyhow = "1"
argon2 = "0.6"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"
chacha20poly1305 = "0.11"
futures = "0.3"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lopdf = { version = "0.47", default-features = false }
mail-parser = { version = "1", features = ["full_encoding"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
quick-xml = "0.41"
object_store = { version = "0.14", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
tantivy = "0.27"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
utoipa = { version = "6", features = ["uuid"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
