server {
  listen 80 default_server;
  server_name _;
  root /srv/images;
  access_log /dev/stdout;
  location /slow/ {
    limit_rate 2k;
  }
  location /paced/ {
    limit_rate 16k;
  }
  location /wrong/ {
    types { }
    default_type text/html;
  }
}

log_format unsubscribe escape=json 'unsubscribe $request_method $request_uri type="$http_content_type" cookie="$http_cookie" authorization="$http_authorization" referer="$http_referer" origin="$http_origin" body="$request_body"';

server {
  listen 443 ssl;
  server_name unsubscribe.it.test outside.it.test;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;
  access_log /dev/stdout unsubscribe;
  location /accept/ {
    proxy_pass http://127.0.0.1:8081;
  }
  location /broken/ {
    proxy_pass http://127.0.0.1:8082;
  }
  location /moved/ {
    return 302 https://unsubscribe.it.test/landing$request_uri;
  }
  location / {
    return 200 "landed\n";
  }
}

server {
  listen 127.0.0.1:8081;
  access_log off;
  return 200 "unsubscribed\n";
}

server {
  listen 127.0.0.1:8082;
  access_log off;
  return 500 "failed\n";
}

log_format data escape=json 'data $host $status $request_method $request_uri inm="$http_if_none_match" etag="$sent_http_etag"';

server {
  listen 443 ssl;
  server_name data.it.test mirror.it.test;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;
  access_log /dev/stdout data;
  root /srv/data;
  location /hop/ {
    rewrite ^/hop/(.*)$ https://mirror.it.test/$1 redirect;
  }
  location /away/ {
    rewrite ^/away/(.*)$ https://outside.it.test/$1 redirect;
  }
}
