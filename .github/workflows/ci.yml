name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: mise run check
      - run: mise run release-features
      - run: cargo test -p holtmail-insights --release panics_unwind
      - run: cargo test -p holtmail-html-scan --release --test bounds timing
