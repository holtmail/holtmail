[package]
name = "holtmail-collection-jmap"
description = "Reading contacts and calendars from JMAP servers (RFC 9610, JMAP Calendars)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
holtmail-collection.workspace = true
async-trait.workspace = true
bytes.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
holtmail-collection = { workspace = true, features = ["testing"] }
axum.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
