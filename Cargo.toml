[workspace]
resolver = "3"
members = ["apps/category-builder", "apps/server", "crates/*", "tests/integration"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/holtmail/holtmail"

[workspace.dependencies]
holtmail-alias = { path = "crates/alias" }
holtmail-alias-addy = { path = "crates/alias-addy" }
holtmail-alias-apple = { path = "crates/alias-apple" }
holtmail-alias-duck = { path = "crates/alias-duck" }
holtmail-alias-fastmail = { path = "crates/alias-fastmail" }
holtmail-alias-relay = { path = "crates/alias-relay" }
holtmail-alias-rules = { path = "crates/alias-rules" }
holtmail-alias-simplelogin = { path = "crates/alias-simplelogin" }
holtmail-aliases = { path = "crates/aliases" }
holtmail-api = { path = "crates/api" }
holtmail-auth = { path = "crates/auth" }
holtmail-blob = { path = "crates/blob" }
holtmail-blob-fs = { path = "crates/blob-fs" }
holtmail-blob-s3 = { path = "crates/blob-s3" }
holtmail-calendar = { path = "crates/calendar" }
holtmail-category = { path = "crates/category" }
holtmail-category-data = { path = "crates/category-data" }
holtmail-category-domains = { path = "crates/category-domains" }
holtmail-category-signals = { path = "crates/category-signals" }
holtmail-collection = { path = "crates/collection" }
holtmail-collection-merge = { path = "crates/collection-merge" }
holtmail-collection-dav = { path = "crates/collection-dav" }
holtmail-collection-graph = { path = "crates/collection-graph" }
holtmail-collection-jmap = { path = "crates/collection-jmap" }
holtmail-core = { path = "crates/core" }
holtmail-auth-results = { path = "crates/auth-results" }
holtmail-html-scan = { path = "crates/html-scan" }
holtmail-insight = { path = "crates/insight" }
holtmail-insight-code = { path = "crates/insight-code" }
holtmail-insight-links = { path = "crates/insight-links" }
holtmail-insight-parcel = { path = "crates/insight-parcel" }
holtmail-insight-pass = { path = "crates/insight-pass" }
holtmail-insight-schemaorg = { path = "crates/insight-schemaorg" }
holtmail-insight-unsubscribe = { path = "crates/insight-unsubscribe" }
holtmail-insights = { path = "crates/insights" }
holtmail-export = { path = "crates/export" }
holtmail-extract = { path = "crates/extract" }
holtmail-extract-basic = { path = "crates/extract-basic" }
holtmail-fetch = { path = "crates/fetch" }
holtmail-fetch-http = { path = "crates/fetch-http" }
holtmail-import = { path = "crates/import" }
holtmail-index = { path = "crates/index" }
holtmail-ledger = { path = "crates/ledger" }
holtmail-links = { path = "crates/links" }
holtmail-index-tantivy = { path = "crates/index-tantivy" }
holtmail-hooks = { path = "crates/hooks" }
holtmail-ingest = { path = "crates/ingest" }
holtmail-json-http = { path = "crates/json-http" }
holtmail-mime = { path = "crates/mime" }
holtmail-oauth = { path = "crates/oauth" }
holtmail-oauth-http = { path = "crates/oauth-http" }
holtmail-pim = { path = "crates/pim" }
holtmail-pdf = { path = "crates/pdf" }
holtmail-people = { path = "crates/people" }
holtmail-pim-sync = { path = "crates/pim-sync" }
holtmail-query = { path = "crates/query" }
holtmail-recur = { path = "crates/recur" }
holtmail-remote = { path = "crates/remote" }
holtmail-sanitize = { path = "crates/sanitize" }
holtmail-secret = { path = "crates/secret" }
holtmail-secret-local = { path = "crates/secret-local" }
holtmail-smtp = { path = "crates/smtp" }
holtmail-source = { path = "crates/source" }
holtmail-source-graph = { path = "crates/source-graph" }
holtmail-source-imap = { path = "crates/source-imap" }
holtmail-source-jmap = { path = "crates/source-jmap" }
holtmail-store = { path = "crates/store" }
holtmail-store-sqlite = { path = "crates/store-sqlite" }
holtmail-sse = { path = "crates/sse" }
holtmail-sync = { path = "crates/sync" }
holtmail-thumbnail = { path = "crates/thumbnail" }
holtmail-webhook = { path = "crates/webhook" }
holtmail-webpush = { path = "crates/webpush" }
holtmail-webhook-http = { path = "crates/webhook-http" }

ammonia = "4"
anyhow = "1"
argon2 = "0.6"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
calcard = { version = "0.3.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", default-features = false }
futures = "0.3"
flate2 = "1"
getrandom = "0.4"
html5ever = "0.40"
idna = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lopdf = { version = "0.47", default-features = false }
mail-parser = { version = "1", features = ["full_encoding"] }
rustls-pki-types = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
proptest = "1"
publicsuffix = "2"
quick-xml = "0.41"
rcgen = "0.14"
object_store = { version = "0.14", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }
skrifa = "0.42"
dejavu = "2.37"
subtle = "2"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
tantivy = "0.27"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
unicode-normalization = "0.1"
unicode-security = "0.1.3"
utoipa = { version = "6", features = ["uuid"] }
url = "2"
uuid = { version = "1", features = ["v7", "v8", "serde"] }
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
