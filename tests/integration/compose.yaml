name: holtmail-it

services:
  ca:
    image: dovecot/dovecot:2.4.5
    entrypoint: ['/bin/sh', '/seed/ca.sh']
    environment:
      SERVER_NAMES: 'DNS:localhost, DNS:dovecot, DNS:greenmail, DNS:stalwart, DNS:radicale, DNS:baikal, DNS:oauth, DNS:minio, DNS:images, DNS:caddy'
    volumes:
      - ./seed/ca.sh:/seed/ca.sh:ro
      - ./.state:/state

  dovecot:
    image: dovecot/dovecot:2.4.5
    depends_on:
      ca:
        condition: service_completed_successfully
    volumes:
      - ./seed/dovecot/auth.conf:/etc/dovecot/conf.d/auth.conf:ro
      - ./seed/dovecot/ssl.conf:/etc/dovecot/conf.d/ssl.conf:ro
      - ./seed/dovecot/acl.conf:/etc/dovecot/conf.d/acl.conf:ro
      - ./.state:/certs:ro
    ports:
      - '127.0.0.1:41143:31143'
      - '127.0.0.1:41993:31993'
      - '127.0.0.1:47443:47443'

  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.imap -Dgreenmail.setup.test.imaps -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false'
    ports:
      - '127.0.0.1:42143:3143'
      - '127.0.0.1:42993:3993'

  stalwart-seed:
    image: stalwartlabs/stalwart:v0.16.27-alpine
    entrypoint: ['/bin/sh', '/seed/seed.sh']
    dns: [127.0.0.1]
    depends_on:
      ca:
        condition: service_completed_successfully
    environment:
      STALWART_RECOVERY_ADMIN: 'admin:it-stalwart-admin-password'
    volumes:
      - ./seed/stalwart:/seed:ro
      - ./seed/stalwart/config.json:/etc/stalwart/config.json:ro
      - ./.state:/certs:ro
      - stalwart-data:/var/lib/stalwart

  stalwart:
    image: stalwartlabs/stalwart:v0.16.27-alpine
    dns: [127.0.0.1]
    depends_on:
      stalwart-seed:
        condition: service_completed_successfully
    environment:
      STALWART_RECOVERY_ADMIN: 'admin:it-stalwart-admin-password'
      STALWART_PUBLIC_URL: 'https://localhost:43443'
    volumes:
      - ./seed/stalwart/config.json:/etc/stalwart/config.json:ro
      - ./.state:/certs:ro
      - stalwart-data:/var/lib/stalwart
    healthcheck:
      test: ['CMD', 'curl', '-fs', '-o', '/dev/null', 'http://127.0.0.1:8080/healthz/live']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - '127.0.0.1:43143:143'
      - '127.0.0.1:43993:993'
      - '127.0.0.1:43443:443'

  radicale:
    image: tomsquest/docker-radicale:3.8.3.0
    depends_on:
      ca:
        condition: service_completed_successfully
    dns: [127.0.0.1]
    volumes:
      - ./seed/radicale/config:/config/config:ro
      - ./.state:/certs:ro
      - radicale-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sk', '-o', '/dev/null', 'https://localhost:5232/.web/']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:44232:5232'

  baikal:
    image: ckulka/baikal:0.10.1-nginx
    depends_on:
      ca:
        condition: service_completed_successfully
    dns: [127.0.0.1]
    volumes:
      - ./seed/baikal/seed.sh:/docker-entrypoint.d/35-holtmail-seed.sh:ro
      - ./seed/baikal/baikal.yaml:/seed/baikal.yaml:ro
      - ./seed/baikal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.state:/certs:ro
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sk -o /dev/null -w "%{http_code}" https://localhost:45443/dav.php/ | grep -q 401',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:45443:45443'

  nextcloud:
    image: nextcloud:35.0.1-apache
    profiles: [nextcloud]
    depends_on:
      ca:
        condition: service_completed_successfully
    dns: [127.0.0.1]
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: it-nextcloud-admin-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
    volumes:
      - ./seed/nextcloud/ssl.conf:/etc/apache2/sites-enabled/holtmail-ssl.conf:ro
      - ./seed/nextcloud/post-install.sh:/docker-entrypoint-hooks.d/post-installation/holtmail.sh:ro
      - ./.state:/certs:ro
      - nextcloud-data:/var/www/html
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -sk https://localhost:46443/status.php | grep -q "\"installed\":true"']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - '127.0.0.1:46443:46443'

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    network_mode: service:dovecot
    depends_on:
      ca:
        condition: service_completed_successfully
      dovecot:
        condition: service_started
    environment:
      SERVER_PORT: '47443'
      JSON_CONFIG_PATH: /seed/config.json
    volumes:
      - ./seed/oauth:/seed:ro
      - ./.state:/certs:ro

  images:
    image: nginx:1.29.3-alpine
    volumes:
      - ./seed/images/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.state/images:/srv/images:ro
    networks:
      images:
        ipv4_address: 11.88.77.10
        aliases: [images.it.test]

  squid:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./seed/squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      default:
      images:
        ipv4_address: 11.88.77.20
    dns: [127.0.0.1]
    ports:
      - '127.0.0.1:48128:3128'

  socks:
    image: serjs/go-socks5-proxy:v0.0.4
    environment:
      REQUIRE_AUTH: 'false'
    networks:
      default:
      images:
        ipv4_address: 11.88.77.21
    dns: [127.0.0.1]
    ports:
      - '127.0.0.1:48180:1080'

  socks-auth:
    image: serjs/go-socks5-proxy:v0.0.4
    environment:
      PROXY_USER: it-proxy-user
      PROXY_PASSWORD: it-proxy-password
    networks:
      default:
      images:
        ipv4_address: 11.88.77.22
    dns: [127.0.0.1]
    ports:
      - '127.0.0.1:48181:1080'

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ['/bin/sh', '/seed/start.sh']
    depends_on:
      ca:
        condition: service_completed_successfully
    dns: [127.0.0.1]
    environment:
      MINIO_ROOT_USER: it-minio-user
      MINIO_ROOT_PASSWORD: it-minio-password
      MINIO_BROWSER: 'off'
      MINIO_UPDATE: 'off'
    volumes:
      - ./seed/minio:/seed:ro
      - ./.state:/certs:ro
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 1s
      timeout: 3s
      retries: 60
    ports:
      - '127.0.0.1:49000:9000'

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      ca:
        condition: service_completed_successfully
    dns: [127.0.0.1]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./seed/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.state:/certs:ro
    ports:
      - '127.0.0.1:49443:49443'

  postfix:
    build: ./seed/postfix
    depends_on:
      ca:
        condition: service_completed_successfully
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./.state:/certs:ro
    ports:
      - '127.0.0.1:42025:25'
    healthcheck:
      test: ['CMD', 'postfix', 'status']
      interval: 1s
      timeout: 3s
      retries: 60

  pdftools:
    build: ./seed/pdftools
    network_mode: none
    volumes:
      - ./.state/pdf:/pdf:ro

networks:
  images:
    internal: true
    ipam:
      config:
        - subnet: 11.88.77.0/24

volumes:
  stalwart-data:
  radicale-data:
  baikal-config:
  baikal-data:
  nextcloud-data:
  minio-data:
