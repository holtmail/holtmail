ipnet.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "io-util", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
holtmail-proxy-protocol = { workspace = true, features = ["testing"] }
rcgen.workspace = true
