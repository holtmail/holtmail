name: Fuzz

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: crates/auth-results/fuzz, target: parse, seeds: '' }
          - { dir: crates/html-scan/fuzz, target: scan, seeds: '' }
          - { dir: crates/links/fuzz, target: unwrap, seeds: '' }
          - { dir: crates/insight-schemaorg/fuzz, target: extract, seeds: '' }
          - { dir: crates/insight-pass/fuzz, target: extract, seeds: '' }
          - { dir: crates/insights/fuzz, target: extract, seeds: ../tests/corpus }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }} -> target
          key: ${{ matrix.dir }}
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: mkdir -p corpus/${{ matrix.target }}
      - run: >-
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} ${{ matrix.seeds }}
          -- -max_total_time=600 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts
          if-no-files-found: ignore
