# Wikidata root classes and the topics they give. CC0 1.0: dedicated to the public domain.
#
# Each root is expanded to every subclass (wdt:P279*). Organisations are then fetched by
# `property`: P452 (industry) in the first pass, P31 (instance of) in the second, for
# organisations without an industry such as airlines, hospitals and pharmacies. `label` is the
# English label on Wikidata; the build checks it so a mistyped QID fails instead of pulling in
# the wrong class.
#
# finance, health and government are sensitive: see sensitive-reviewed.toml.

# Shared platforms: site builders, free hosts and link shorteners. An organisation's site on one
# of these says nothing about the platform, so their rows are never written. Social networks
# are not listed: a page on them has a path and is skipped anyway, and their own row is social.
skip_domains = [
  "bit.ly",
  "business.site",
  "google.com",
  "jimdo.com",
  "jimdosite.com",
  "linktr.ee",
  "narod.ru",
  "squarespace.com",
  "tripod.com",
  "ucoz.ru",
  "webnode.page",
  "weebly.com",
  "wixsite.com",
  "wordpress.com",
]

