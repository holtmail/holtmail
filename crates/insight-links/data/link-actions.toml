# Path and query tokens. An action key maps the token to that action; `any` tokens add the
# path_token weight without naming an action.
[paths]
verify = ["/verify", "/verification", "/validate", "/verify-email", "/email-verification"]
confirm = ["/confirm", "/confirmation", "/approve"]
activate = ["/activate", "/activation"]
reset_password = ["/reset", "/reset-password", "/password", "/password-reset", "/forgot", "/recover"]
sign_in = ["/login", "/signin", "/sign-in", "/log-in", "/auth"]
magic_link = ["/magic", "/magic-link", "/magiclink"]
view_order = ["/order", "/orders", "/purchase"]
track = ["/track", "/tracking", "/shipment"]
check_in = ["/checkin", "/check-in", "/online-check-in"]
any = ["token=", "otp="]

# Wallet save links. A URL that starts with one of these is wallet_save whatever its text says,
# and scores at least the wallet weight. The JWT that follows is never decoded.
[wallet]
prefixes = ["https://pay.google.com/gp/v/save/"]

# Hosts whose links are profiles and shares, not actions. A host matches itself and every
# subdomain.
[social]
domains = [
  "facebook.com", "fb.com", "x.com", "twitter.com", "instagram.com", "linkedin.com",
  "youtube.com", "youtu.be", "tiktok.com", "vk.com", "ok.ru", "t.me", "telegram.me",
  "pinterest.com", "reddit.com", "threads.net", "whatsapp.com", "wa.me", "snapchat.com",
  "discord.gg", "discord.com", "mastodon.social", "bsky.app",
]

# URL substrings that make a link an unsubscribe, preference or privacy link; such links score 0.
[skip]
tokens = [
  "unsubscribe", "unsub", "opt-out", "optout", "opt_out", "preferences", "preference-center",
  "preference_center", "subscription-center", "manage-subscription", "email-settings",
  "privacy", "abmelden", "desinscription", "désinscription", "darse-de-baja", "cancelar-inscricao",
]
