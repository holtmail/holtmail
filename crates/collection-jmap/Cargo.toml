[package]
name = "holtmail-collection-jmap"
description = "Reading and writing contacts and calendars on JMAP servers (RFC 9610, JMAP Calendars)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
holtmail-core.workspace = true
holtmail-collection.workspace = true
holtmail-sse.workspace = true
async-trait.workspace = true
bytes.workspace = true
calcard = { workspace = true, features = ["jmap"] }
chrono.workspace = true
chrono-tz.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
futures.workspace = true
holtmail-core = { workspace = true, features = ["testing"] }
holtmail-collection = { workspace = true, features = ["testing"] }
axum.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
