# ---------------------------------------------------------------------------------
# Parcels (docs/INSIGHTS.md §7.4). Check digits, as the numbers here were computed:
# - s10: AA + 8 digits + check + CC; weights 8,6,4,2,3,5,9,7 over the 8 digits;
#   c = 11 - sum % 11; c = 10 becomes 0, c = 11 becomes 5.
# - ups: 1Z + 15 chars + check; digits as is, letters (ord(ch) - 63) % 10; weights 1,2
#   alternating from the first char after 1Z; check = (10 - sum % 10) % 10.
# - usps (IMpb, 20-22 digits), fedex 15 digits, russian_post 14 digits: the last digit
#   checks the others; weights 3,1,3,1... from the rightmost payload digit leftwards;
#   check = (10 - sum % 10) % 10.
# - fedex 12 digits: weights 3,1,7,3,1,7... from the leftmost of the first 11 digits
#   rightwards; check = sum % 11 % 10.
# - dhl_express: 10 digits; check = (first 9 digits as a number) % 7.
# ---------------------------------------------------------------------------------

