# Word lists and weights for holtmail-insight-code.
#
# Every phrase is matched NFKC-normalised and lowercased. Phrases in spaced scripts match as whole
# words; phrases with CJK, kana, Hangul or Thai characters match as substrings. A phrase written
# with a leading "-" also matches at the end of a longer word ("-straße" in "Musterstraße"). When a hit of one
# list lies inside a longer hit of another list, the longer hit wins ("promo code" beats "code").
# The hash of this file is part of the extractor's version.

[weights]
base = 300
keyword = 300
keyword_window = 80
subject = 150
emphasis = 150
alone_on_line = 100
early = 50
early_chars = 1024
both_parts = 50
alphanumeric = -100
extra_occurrence = 25
extra_cap = 75
margin = 150
likely = 600
year_like = -150
gate_chars = 4096
promo_window = 40
context_tokens = 3
list_values = 3
max_occurrences = 4096

