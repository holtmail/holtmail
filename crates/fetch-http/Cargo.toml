[package]
name = "holtmail-fetch-http"
description = "Fetching remote images and one-click unsubscribe over HTTP, public addresses only, and data files from pinned hosts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
test-networks = []

[dependencies]
holtmail-core.workspace = true
holtmail-fetch.workspace = true
async-trait.workspace = true
bytes.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
url.workspace = true

[dev-dependencies]
holtmail-core = { workspace = true, features = ["testing"] }
holtmail-fetch = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
