# Labels, URL tokens and weights for holtmail-insight-links.
#
# Labels are matched against the anchor text and aria-label, NFKC-normalised and lowercased.
# Labels in spaced scripts match as whole words; labels with CJK, kana, Hangul or Thai characters
# match as substrings. When several labels match, the one that starts first wins, and the longest
# one among those that start at the same place ("confirm your email" beats "confirm").
#
# URL tokens are matched against the lowercased href and against its percent-decoded form, so a
# wrapped link (safelinks, google /url, urldefense) is read by the path it carries. A token that
# starts with "/" matches a path segment start and must not be followed by a letter or digit; a
# token that ends with "=" matches a query parameter name.
#
# The hash of this file is part of the extractor's version.

[weights]
label = 400
aria_label = 300
button_like = 150
path_token = 150
first = 50
in_footer = -400
social = -300
wallet = 600
likely = 600

