auth_allow_cleartext = yes
auth_mechanisms = plain xoauth2 oauthbearer
ssl_client_ca_file = /certs/ca.crt

passdb locked {
  driver = passwd-file
  passwd_file_path = /certs/dovecot-locked-users
  deny = yes
}

passdb oauth2 {
  driver = oauth2
  mechanisms_filter = xoauth2 oauthbearer
}

oauth2 {
  introspection_mode = post
  introspection_url = https://it-dovecot:it-introspect-password@localhost:47443/default/introspect
  username_attribute = sub
  active_attribute = active
  active_value = true
}

passdb static {
  mechanisms_filter = plain login
  password = {PLAIN}it-imap-password
}
