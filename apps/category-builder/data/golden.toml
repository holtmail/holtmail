# Golden domains: stable organisations whose topics must not change. CC0 1.0: dedicated to the
# public domain.
#
# The build fails when a domain here is missing from the output or carries other topics.
# Entries are checked by eye in a real build's output; non-sensitive topics only. `absent`
# lists domains that must have no row, neither themselves nor any subdomain: mailbox providers
# people write from. The build and `check` add `skip_domains` and `mailbox_domains` to it.

absent = [
  "aol.com",
  "free.fr",
  "gmail.com",
  "gmx.de",
  "hotmail.com",
  "icloud.com",
  "mail.ru",
  "naver.com",
  "o2.sk",
  "orange.fr",
  "orange.sk",
  "outlook.com",
  "qq.com",
  "verizon.com",
  "web.de",
  "yahoo.com",
  "yandex.ru",
]

