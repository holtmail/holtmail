[package]
name = "holtmail-insights-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
holtmail-insight = { path = "../../insight" }
holtmail-insight-code = { path = "../../insight-code" }
holtmail-insight-links = { path = "../../insight-links" }
holtmail-insight-parcel = { path = "../../insight-parcel" }
holtmail-insight-pass = { path = "../../insight-pass" }
holtmail-insight-schemaorg = { path = "../../insight-schemaorg" }
holtmail-insight-unsubscribe = { path = "../../insight-unsubscribe" }
holtmail-insights = { path = ".." }
holtmail-mime = { path = "../../mime" }

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false

[workspace]
