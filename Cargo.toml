[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/holtmail/holtmail"

[workspace.dependencies]
holtmail-blob = { path = "crates/blob" }

async-trait = "0.1"
blake3 = "1"
bytes = "1"
object_store = { version = "0.14", features = ["aws"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
